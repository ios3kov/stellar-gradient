[package]
name = "stellar_gradient_host"
version = "0.8.6"
edition = "2024"
license = "MIT OR Apache-2.0"
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
after-effects = "0.4.0"

[build-dependencies]
pipl = "0.1.1"
cc = "1.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = true
