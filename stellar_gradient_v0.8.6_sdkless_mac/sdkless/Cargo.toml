[package]
name = "stellar_gradient_host"
version = "0.8.6"
edition = "2024"
license = "MIT OR Apache-2.0"
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
after-effects = { git = "https://github.com/virtualritz/after-effects", rev = "83dcc93734fd5db1335b6ec83cba7a6505a39dcc", package = "after-effects" }

[build-dependencies]
pipl = { git = "https://github.com/virtualritz/after-effects", rev = "83dcc93734fd5db1335b6ec83cba7a6505a39dcc", package = "pipl" }
cc = "1.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = true
