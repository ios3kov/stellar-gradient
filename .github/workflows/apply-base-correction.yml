name: Apply tested base correction
on:
  push:
    branches: [fix/stellar-release-gate]
    paths: [.github/workflows/apply-base-correction.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'ios3kov/stellar-gradient' && github.ref == 'refs/heads/fix/stellar-release-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Apply locally validated edits and verify complete source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 61e82ab0f1281563e62891f97c32a8ba98674570
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess
          root=Path('.')
          def replace(path,old,new):
              p=root/path
              text=p.read_text()
              assert text.count(old)==1, (path,'expected exactly one original sequence')
              p.write_text(text.replace(old,new))
          replace('README.md',"The render algorithms and saved parameter IDs are unchanged by v0.9.6. Package version, PiPL version and About now come from Cargo's package version. About includes the generated Build ID; the signed package includes commit, source state, source hashes and toolchain metadata. CI requires clean canonical source, a committed dependency lock and passing code-side checks before packaging.\n","v0.9.7 corrects base palette phase/pixel origin and linear RGB interpolation on CPU and Metal. Saved parameter IDs and defaults are unchanged. Grain, Turbulence, Softness and full Cosmic parity are still open; see [base correction evidence](stellar_gradient_v0.8.6_sdkless_mac/docs/BASE_PALETTE_FIX.md). Package version, PiPL version and About now come from Cargo's package version. About includes the generated Build ID; the signed package includes commit, source state, source hashes and toolchain metadata. CI requires clean canonical source, a committed dependency lock and passing code-side checks before packaging.\n")
          replace('README.md','## Current development candidate: v0.9.6 (not a release)\n','## Current development candidate: v0.9.7 (not a release)\n')
          replace('stellar_gradient_v0.8.6_sdkless_mac/CMakeLists.txt','add_test(NAME stellar_mfr_stress COMMAND stellar_mfr_stress)\n','add_test(NAME stellar_mfr_stress COMMAND stellar_mfr_stress)\n\nadd_executable(stellar_palette_geometry tests/palette_geometry.cpp)\ntarget_link_libraries(stellar_palette_geometry PRIVATE stellar_core)\nadd_test(NAME stellar_palette_geometry COMMAND stellar_palette_geometry)\n')
          replace('stellar_gradient_v0.8.6_sdkless_mac/docs/STATUS.md','- Exact Cosmic Depth/Rounding CPU+Metal is unchanged.\n','- Exact Cosmic Depth/Rounding CPU+Metal is unchanged.\n\n\n## 2026-09-28: native base correction v0.9.7 (development, not release)\n\nThe returned 22-case feature isolation completed. Base-only reference analysis confirmed a half-cycle/pixel-origin shift and incorrect segment easing. CPU/Metal base math is corrected; independent geometry test fails on the parent and passes on the correction. Local strict and ASan/UBSan core: 8/8 each; bridge tests PASS. Full default/preset parity remains open, including Grain, Turbulence and Softness. See BASE_PALETTE_FIX.md and the isolated-run evidence. Actual AE/Metal execution of v0.9.7 is NOT RUN. User retains v0.9.6; no reinstall requested in this stage.\n')
          replace('stellar_gradient_v0.8.6_sdkless_mac/sdkless/Cargo.lock','version = "0.9.6"\n','version = "0.9.7"\n')
          replace('stellar_gradient_v0.8.6_sdkless_mac/sdkless/Cargo.toml','version = "0.9.6"\n','version = "0.9.7"\n')
          replace('stellar_gradient_v0.8.6_sdkless_mac/src/core/Math.h','    const float f = smooth01(x - std::floor(x));\n','    // Palette segments are linear in working-space RGB; easing shifts their colors.\n    const float f = x - std::floor(x);\n')
          replace('stellar_gradient_v0.8.6_sdkless_mac/src/cpu/ReferenceRenderer.cpp','                const float nx = (static_cast<float>(x) - cx) / bw;\n                const float ny = (static_cast<float>(y) - cy) / bh;\n                float u = (nx * dir_x + ny * dir_y) * q.cycles + q.offset + q.phase_deg / 360.0f;\n','                // Base samples use the pixel origin (x/width, y/height), not pixel centers.\n                // Depth retains its independent center definition.\n                const float nx = (static_cast<float>(x) - cx - 0.5f) / bw;\n                const float ny = (static_cast<float>(y) - cy - 0.5f) / bh;\n                float u = (nx * dir_x + ny * dir_y) * q.cycles + 0.5f + q.offset + q.phase_deg / 360.0f;\n')
          replace('stellar_gradient_v0.8.6_sdkless_mac/src/gpu/StellarGradientMetal.metal','    float nx=(float(gid.x)-p.bound_cx)*p.inv_bw,ny=(float(gid.y)-p.bound_cy)*p.inv_bh;\n    float u=(nx*p.dir_x+ny*p.dir_y)*p.cycles+p.phase_offset;\n','    // Match the CPU base pixel-origin convention; do not move the depth origin.\n    float nx=(float(gid.x)-p.bound_cx-0.5f)*p.inv_bw,ny=(float(gid.y)-p.bound_cy-0.5f)*p.inv_bh;\n    float u=(nx*p.dir_x+ny*p.dir_y)*p.cycles+0.5f+p.phase_offset;\n')
          replace('stellar_gradient_v0.8.6_sdkless_mac/src/gpu/StellarGradientMetal.metal','inline float3 palette(constant SGParamsGPU& p,float t){t=t-floor(t);float z=t*5.0f;int i0=int(floor(z))%5,i1=(i0+1)%5;float f=sm(z-floor(z));float3 a=float3(p.colors[i0].r,p.colors[i0].g,p.colors[i0].b),b=float3(p.colors[i1].r,p.colors[i1].g,p.colors[i1].b),c=mix(a,b,f);float y=dot(c,float3(.2126,.7152,.0722));return (y+(c-y)*p.saturation)*p.brightness;}\n','inline float3 palette(constant SGParamsGPU& p,float t){t=t-floor(t);float z=t*5.0f;int i0=int(floor(z))%5,i1=(i0+1)%5;float f=z-floor(z);float3 a=float3(p.colors[i0].r,p.colors[i0].g,p.colors[i0].b),b=float3(p.colors[i1].r,p.colors[i1].g,p.colors[i1].b),c=mix(a,b,f);float y=dot(c,float3(.2126,.7152,.0722));return (y+(c-y)*p.saturation)*p.brightness;}\n')
          replace('stellar_gradient_v0.8.6_sdkless_mac/tests/quality_reference.cpp','    const Signature expected_base{{0.204531780142,0.111062071743,0.183825664775,0.363154532137},{0.991368830204f,0.680644214153f,0.960009276867f,1.0f},0.650493346755};\n    const Signature expected_heavy{{0.224864763109,0.119129548097,0.260343978208,0.389058099858},{1.1093994379f,0.781969428062f,1.05849254131f,1.0f},0.754382439322};\n    const Signature expected_diffusion{{0.234482478382,0.124349958217,0.271920968823,0.406525578987},{1.09005272388f,0.781263768673f,1.05771040916f,1.0f},0.686040455902};\n','    const Signature expected_base{{0.197606848364,0.0984812350607,0.229838477415,0.363154532137},{0.991337895393f,0.680429458618f,0.960008561611f,1.0f},0.68247069041};\n    const Signature expected_heavy{{0.283385199018,0.145518645682,0.217021554956,0.393068882846},{1.17579376698f,0.818551063538f,1.05664932728f,1.0f},0.797906756812};\n    const Signature expected_diffusion{{0.295177333564,0.150957449739,0.227051498241,0.410032585306},{1.17445683479f,0.810662865639f,1.05105912685f,1.0f},0.733425523617};\n')
          replace('stellar_gradient_v0.8.6_sdkless_mac/tests/quality_reference.cpp','    // Baselines are generated from the audited CPU F32 reference renderer.\n','    // v0.9.7: intentional base-origin/linear-palette correction; see BASE_PALETTE_FIX.md.\n    // Prior signatures remain in Git history and the stage evidence record.\n')
          subprocess.run(['python3','tools/embed_metal.py'],cwd='stellar_gradient_v0.8.6_sdkless_mac',check=True)
          root=Path('stellar_gradient_v0.8.6_sdkless_mac')
          manifest=root/'docs/SOURCE_FREEZE_V08_SHA256.txt'
          paths=[line.split('  ',1)[1] for line in manifest.read_text().splitlines() if line.strip()]
          assert len(paths)==53
          paths.append('tests/palette_geometry.cpp')
          manifest.write_text(''.join(hashlib.sha256((root/p).read_bytes()).hexdigest()+'  '+p+'\n' for p in sorted(paths)))
          PY
          git rm -- .github/workflows/apply-base-correction.yml
          git add -- README.md stellar_gradient_v0.8.6_sdkless_mac diagnostics
          test "$(git write-tree)" = b06c15057eecd1cb67b6bd68556ed9f92b12a977
          cd stellar_gradient_v0.8.6_sdkless_mac
          python3 tools/verify_code_freeze.py
          python3 tools/verify_v08_host_freeze.py
          cmake -S . -B build-transfer -DCMAKE_BUILD_TYPE=Release -DSTELLAR_WARNINGS_AS_ERRORS=ON
          cmake --build build-transfer -j 3
          ctest --test-dir build-transfer --output-on-failure --timeout 120
          cd ..
          test "$(git write-tree)" = b06c15057eecd1cb67b6bd68556ed9f92b12a977
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: correct base gradient origin and linear palette on CPU and Metal'
          git push origin HEAD:refs/heads/fix/stellar-release-gate
