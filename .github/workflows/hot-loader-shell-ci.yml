name: Hot Loader Shell CI

on:
  push:
    branches: ["feature/ae-hot-loader-shell"]
    paths:
      - ".github/workflows/hot-loader-shell-ci.yml"
      - "stellar_gradient_v0.8.6_sdkless_mac/sdkless/**"
      - "stellar_gradient_v0.8.6_sdkless_mac/src/**"
  workflow_dispatch:

concurrency:
  group: stellar-hot-loader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    runs-on: macos-15
    env:
      SRC: stellar_gradient_v0.8.6_sdkless_mac
      RUSTFLAGS: --cfg threaded_rendering --cfg smart_render --cfg gpu_render --cfg catch_panics
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-apple-darwin
          components: rustfmt

      - name: Static checks
        run: |
          set -euo pipefail
          FMT_COPY="$RUNNER_TEMP/stellar-sdkless-fmt"
          rm -rf "$FMT_COPY"
          cp -R "$SRC/sdkless" "$FMT_COPY"
          cargo fmt --manifest-path "$FMT_COPY/Cargo.toml"
          cargo fmt --manifest-path "$FMT_COPY/Cargo.toml" -- --check
          python3 stellar_gradient_v0.8.6_sdkless_mac/sdkless/tools/verify_shell_metadata.py stellar_gradient_v0.8.6_sdkless_mac/sdkless/build.rs stellar_gradient_v0.8.6_sdkless_mac/sdkless/shell/StellarGradientShell.cpp
          python3 stellar_gradient_v0.8.6_sdkless_mac/sdkless/tools/verify_hot_reload_state.py stellar_gradient_v0.8.6_sdkless_mac/sdkless/src/lib.rs stellar_gradient_v0.8.6_sdkless_mac/sdkless/shell/StellarGradientShell.cpp
          zsh -n "$SRC/sdkless/tools/stage_hot_reload_macos.command"
          zsh -n "$SRC/sdkless/tools/install_hot_loader_package.command"
          zsh -n "$SRC/sdkless/tools/stage_packaged_hot_reload.command"
          xcrun clang++ -std=c++17 -arch arm64 -Wall -Wextra -Wpedantic -Werror -fsyntax-only "$SRC/sdkless/shell/StellarGradientShell.cpp"

      - name: Build implementation
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-hot-default
          AE_HOT_LOADER_IMPL_LABEL: stellar-default
        run: |
          set -euo pipefail
          cargo build --manifest-path "$SRC/sdkless/Cargo.toml" --release --target aarch64-apple-darwin

      - name: Build candidate implementation
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-hot-candidate
          AE_HOT_LOADER_IMPL_LABEL: stellar-candidate-v2
        run: |
          set -euo pipefail
          cargo build --manifest-path "$SRC/sdkless/Cargo.toml" --release --target aarch64-apple-darwin

      - name: Build shell and assemble bundle
        run: |
          set -euo pipefail
          ROOT="target-hot-default/aarch64-apple-darwin/release"
          CANDIDATE_ROOT="target-hot-candidate/aarch64-apple-darwin/release"
          BUNDLE="dist/StellarGradient.plugin"
          mkdir -p "$BUNDLE/Contents/MacOS" "$BUNDLE/Contents/Frameworks" "$BUNDLE/Contents/Resources"

          xcrun clang++ -std=c++17 -O2 -arch arm64 -mmacosx-version-min=11.0 -dynamiclib -fvisibility=hidden \
            "$SRC/sdkless/shell/StellarGradientShell.cpp" \
            -o "$BUNDLE/Contents/MacOS/StellarGradient"

          cp "$ROOT/libstellar_gradient_host.dylib" "$BUNDLE/Contents/Frameworks/libstellar_gradient_impl.dylib"
          cp "$ROOT/stellar_gradient_host.rsrc" "$BUNDLE/Contents/Resources/StellarGradient.rsrc"
          cp "$ROOT/stellar_gradient_host_PkgInfo" "$BUNDLE/Contents/PkgInfo"
          cp "$ROOT/stellar_gradient_host_Info.plist" "$BUNDLE/Contents/Info.plist"

          /usr/libexec/PlistBuddy -c 'Set :CFBundleExecutable StellarGradient' "$BUNDLE/Contents/Info.plist" || /usr/libexec/PlistBuddy -c 'Add :CFBundleExecutable string StellarGradient' "$BUNDLE/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier com.stellarlabs.StellarGradient' "$BUNDLE/Contents/Info.plist" || /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string com.stellarlabs.StellarGradient' "$BUNDLE/Contents/Info.plist"

          codesign --force --sign - "$BUNDLE/Contents/Frameworks/libstellar_gradient_impl.dylib"
          codesign --force --deep --sign - "$BUNDLE"
          codesign --verify --deep --strict "$BUNDLE"

          nm -gU "$BUNDLE/Contents/MacOS/StellarGradient" | grep -E 'EffectMain|PluginDataEntryFunction2|AEHotLoader_ShellReload|AEHotLoader_ShellABI|AEHotLoader_ShellKey'
          nm -gU "$BUNDLE/Contents/Frameworks/libstellar_gradient_impl.dylib" | grep -E 'EffectMain|AEHotLoader_ImplementationABI|AEHotLoader_ImplementationStateABI|AEHotLoader_ImplementationKey|AEHotLoader_ImplementationLabel|AEHotLoader_ImplementationRuntimeABI'
          strings "$BUNDLE/Contents/Frameworks/libstellar_gradient_impl.dylib" | grep 'stellar-default'
          strings "$CANDIDATE_ROOT/libstellar_gradient_host.dylib" | grep 'stellar-candidate-v2'
          for impl in "$BUNDLE/Contents/Frameworks/libstellar_gradient_impl.dylib" "$CANDIDATE_ROOT/libstellar_gradient_host.dylib"; do
            if otool -L "$impl" | tail -n +2 | grep -E '@(rpath|loader_path|executable_path)'; then
              echo "ERROR: hot-reload implementation has relative/private dylib dependencies: $impl"
              exit 6
            fi
          done
          for bin in             "$BUNDLE/Contents/MacOS/StellarGradient"             "$BUNDLE/Contents/Frameworks/libstellar_gradient_impl.dylib"             "$CANDIDATE_ROOT/libstellar_gradient_host.dylib"; do
            xcrun vtool -show-build "$bin" | grep -Eq 'minos[[:space:]]+11\.0' || {
              echo "ERROR: unexpected macOS deployment target: $bin"
              xcrun vtool -show-build "$bin"
              exit 7
            }
          done
          plutil -lint "$BUNDLE/Contents/Info.plist"

          ditto -c -k --sequesterRsrc --keepParent "$BUNDLE" StellarGradient-hot-loader-shell.zip

      - name: Smoke bundled default to candidate reload
        shell: bash
        run: |
          set -euo pipefail
          FAKE_HOME="$RUNNER_TEMP/hot-loader-home"
          IMPL_DIR="$FAKE_HOME/Library/Application Support/AE Hot Loader/implementations/stellar-gradient"
          mkdir -p "$IMPL_DIR"

          cat > "$RUNNER_TEMP/reload_smoke.cpp" <<'CPP'
          #include <cstdlib>
          #include <cstdio>
          #include <cstring>
          #include <dlfcn.h>
          #include <filesystem>
          using ReloadFn = int (*)(char*, std::size_t);

          int main(int argc, char** argv) {
              if (argc != 5) return 10;
              void* handle = dlopen(argv[1], RTLD_NOW | RTLD_LOCAL);
              if (!handle) { std::fprintf(stderr, "%s\n", dlerror()); return 11; }
              auto reload = reinterpret_cast<ReloadFn>(dlsym(handle, "AEHotLoader_ShellReload"));
              if (!reload) return 12;

              char initial[2048]{};
              const int first = reload(initial, sizeof(initial));
              std::printf("initial=%d %s\n", first, initial);
              if (first != 0 || std::strstr(initial, argv[3]) == nullptr) return 13;

              const char* home = std::getenv("HOME");
              if (!home) return 14;
              std::filesystem::path current =
                  std::filesystem::path(home) /
                  argv[4] /
                  "current.dylib";
              std::filesystem::create_directories(current.parent_path());
              std::filesystem::copy_file(
                  argv[2], current, std::filesystem::copy_options::overwrite_existing);

              char candidate[2048]{};
              const int second = reload(candidate, sizeof(candidate));
              std::printf("candidate=%d %s\n", second, candidate);
              if (second != 0 || std::strstr(candidate, "candidate") == nullptr) return 15;

              char unchanged[2048]{};
              const int third = reload(unchanged, sizeof(unchanged));
              std::printf("unchanged=%d %s\n", third, unchanged);
              return third == 1 ? 0 : 16;
          }
          CPP

          xcrun clang++ -std=c++17 -arch arm64 "$RUNNER_TEMP/reload_smoke.cpp" -o "$RUNNER_TEMP/reload_smoke"
          HOME="$FAKE_HOME" "$RUNNER_TEMP/reload_smoke" \
            "$(pwd)/dist/StellarGradient.plugin/Contents/MacOS/StellarGradient" \
            "$(pwd)/target-hot-candidate/aarch64-apple-darwin/release/libstellar_gradient_host.dylib" \
            "stellar-default" \
            "Library/Application Support/AE Hot Loader/implementations/stellar-gradient"

      - name: Package hot-loader test kit
        run: |
          set -euo pipefail
          rm -rf package StellarGradient-hot-loader-shell-package.zip
          mkdir -p package
          cp -R dist/StellarGradient.plugin package/
          cp target-hot-candidate/aarch64-apple-darwin/release/libstellar_gradient_host.dylib package/StellarGradientImpl-candidate.dylib
          cp "$SRC/sdkless/tools/install_hot_loader_package.command" package/INSTALL_HOT_LOADER.command
          cp "$SRC/sdkless/tools/stage_packaged_hot_reload.command" package/STAGE_CANDIDATE.command
          chmod +x package/INSTALL_HOT_LOADER.command package/STAGE_CANDIDATE.command
          codesign --force --sign - package/StellarGradientImpl-candidate.dylib
          ditto -c -k --sequesterRsrc --keepParent package StellarGradient-hot-loader-shell-package.zip

      - uses: actions/upload-artifact@v4
        with:
          name: StellarGradient-hot-loader-shell
          path: StellarGradient-hot-loader-shell-package.zip
          if-no-files-found: error
