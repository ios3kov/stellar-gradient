name: Hot Loader Shell

on:
  push:
    branches: ["feature/hot-loader-shell"]
    paths:
      - "stellar_gradient_v0.8.6_sdkless_mac/sdkless/**"
      - ".github/workflows/hot-loader-shell.yml"
  workflow_dispatch:

concurrency:
  group: stellar-hot-loader-${{ github.ref }}
  cancel-in-progress: true

env:
  SRC: stellar_gradient_v0.8.6_sdkless_mac

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Static shell checks
        run: |
          set -euo pipefail
          zsh -n "$SRC/sdkless/tools/stage_hot_reload_macos.command"
          zsh -n "$SRC/sdkless/tools/build_and_install_macos.command"
          xcrun clang++ -std=c++17 -arch arm64 -Wall -Wextra -Wpedantic -Werror \
            -fsyntax-only "$SRC/sdkless/shell/StellarGradientShell.cpp"

      - name: Build implementation
        working-directory: ${{ env.SRC }}/sdkless
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          RUSTFLAGS: "--cfg threaded_rendering --cfg smart_render --cfg gpu_render --cfg catch_panics"
        run: |
          set -euo pipefail
          cargo build --release --target aarch64-apple-darwin

      - name: Build shell and bundle
        run: |
          set -euo pipefail
          TRIPLE=aarch64-apple-darwin
          TARGET="target/$TRIPLE/release"
          BUNDLE="dist/StellarGradient.plugin"

          xcrun clang++ -std=c++17 -O2 -arch arm64 -dynamiclib -fvisibility=hidden \
            "$SRC/sdkless/shell/StellarGradientShell.cpp" \
            -o "$TARGET/StellarGradientShell"

          rm -rf "$BUNDLE"
          mkdir -p "$BUNDLE/Contents/MacOS" "$BUNDLE/Contents/Frameworks" "$BUNDLE/Contents/Resources"
          cp "$TARGET/StellarGradientShell" "$BUNDLE/Contents/MacOS/StellarGradient"
          cp "$TARGET/libstellar_gradient_host.dylib" "$BUNDLE/Contents/Frameworks/StellarGradientImpl.dylib"
          cp "$TARGET/stellar_gradient_host.rsrc" "$BUNDLE/Contents/Resources/StellarGradient.rsrc"
          cp "$TARGET/stellar_gradient_host_PkgInfo" "$BUNDLE/Contents/PkgInfo"
          cp "$TARGET/stellar_gradient_host_Info.plist" "$BUNDLE/Contents/Info.plist"

          /usr/libexec/PlistBuddy -c 'Set :CFBundleExecutable StellarGradient' "$BUNDLE/Contents/Info.plist" || \
            /usr/libexec/PlistBuddy -c 'Add :CFBundleExecutable string StellarGradient' "$BUNDLE/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier com.stellarlabs.StellarGradient' "$BUNDLE/Contents/Info.plist" || \
            /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string com.stellarlabs.StellarGradient' "$BUNDLE/Contents/Info.plist"

          codesign --force --sign - "$BUNDLE/Contents/Frameworks/StellarGradientImpl.dylib"
          codesign --force --deep --sign - "$BUNDLE"
          codesign --verify --deep --strict "$BUNDLE"

          nm -gU "$BUNDLE/Contents/MacOS/StellarGradient" | grep -E 'PluginDataEntryFunction2|EffectMain|AEHotLoader_ShellReload'
          nm -gU "$BUNDLE/Contents/Frameworks/StellarGradientImpl.dylib" | grep -E 'EffectMain|AEHotLoader_ImplementationLabel'
          strings "$BUNDLE/Contents/Resources/StellarGradient.rsrc" | grep -F 'StellarLabs.StellarGradient'
          plutil -lint "$BUNDLE/Contents/Info.plist"

      - uses: actions/upload-artifact@v4
        with:
          name: StellarGradient-hot-loader-shell
          path: |
            dist/StellarGradient.plugin
            target/aarch64-apple-darwin/release/libstellar_gradient_host.dylib
          if-no-files-found: error
