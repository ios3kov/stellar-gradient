name: Apply reviewed Stellar identity update
on:
  push:
    branches: [fix/stellar-release-gate]
    paths: [.github/workflows/stellar-source-update.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'ios3kov/stellar-gradient' && github.ref == 'refs/heads/fix/stellar-release-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Apply exact reviewed patch and validate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 233fafa762eeeec977574d2e6dbb70c0cc2c9225
          sed -e 's/^@@ -0,0 +1,88 @@$/@@ -0,0 +1,86 @@/' -e 's/^@@ -0,0 +1,123 @@$/@@ -0,0 +1,124 @@/' .ci/stellar-source-update.patch > "$RUNNER_TEMP/stellar-source-update.patch"
          echo "45224a7215b2373cde0323600e4b2e60880ec032dfd651715429f281ac036f57  $RUNNER_TEMP/stellar-source-update.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/stellar-source-update.patch"
          git apply "$RUNNER_TEMP/stellar-source-update.patch"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('stellar_gradient_v0.8.6_sdkless_mac')
          test = root / 'tools/test_build_identity.py'
          old = '        self.git("init", "-q")'
          new = old + '\n        self.git("config", "maintenance.auto", "false")\n        self.git("config", "gc.auto", "0")'
          text = test.read_text()
          assert text.count(old) == 1
          test.write_text(text.replace(old, new))
          digest = hashlib.sha256(test.read_bytes()).hexdigest()
          assert digest == '86c903554a2831b8cfc4dc4da4518c2bd6cb2fa95ce3d99c4c7f151e6879aacd'
          manifest = root / 'docs/SOURCE_FREEZE_V08_SHA256.txt'
          text = manifest.read_text()
          old = 'c4b0d0f1fd11ec578e7b07b0aa4f7e8bf3b9ceaf089e0ef85925b7e5111400e0  tools/test_build_identity.py'
          assert text.count(old) == 1
          manifest.write_text(text.replace(old, digest + '  tools/test_build_identity.py'))
          assert hashlib.sha256(manifest.read_bytes()).hexdigest() == 'e7de497c7f44f1057853736b8ddc275f89928110f382e192bc0e34d0ca41b32e'
          PY
          cd stellar_gradient_v0.8.6_sdkless_mac
          python3 tools/test_build_identity.py
          python3 tools/verify_code_freeze.py
          python3 tools/verify_sdkless_host.py
          python3 tools/verify_v08_host_freeze.py
          cd ..
          test "$(git diff --name-only | wc -l)" -eq 7
          git add -- .gitignore README.md stellar_gradient_v0.8.6_sdkless_mac/sdkless/Cargo.toml stellar_gradient_v0.8.6_sdkless_mac/sdkless/Cargo.lock stellar_gradient_v0.8.6_sdkless_mac/sdkless/build.rs stellar_gradient_v0.8.6_sdkless_mac/sdkless/src/lib.rs stellar_gradient_v0.8.6_sdkless_mac/tools/build_identity.py stellar_gradient_v0.8.6_sdkless_mac/tools/package_identity.py stellar_gradient_v0.8.6_sdkless_mac/tools/test_build_identity.py stellar_gradient_v0.8.6_sdkless_mac/docs/BUILD_IDENTITY.md stellar_gradient_v0.8.6_sdkless_mac/docs/FINISH_GATE.md stellar_gradient_v0.8.6_sdkless_mac/docs/SOURCE_FREEZE_V08_SHA256.txt
          test "$(git diff --cached --name-only | wc -l)" -eq 12
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: synchronize Stellar v0.9.6 runtime and package identity'
          git push origin HEAD:refs/heads/fix/stellar-release-gate
