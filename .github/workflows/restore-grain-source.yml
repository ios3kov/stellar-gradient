name: Restore verified grain source
on:
  push:
    branches: [fix/stellar-release-gate]
    paths: [.github/workflows/restore-grain-source.yml]
permissions:
  contents: write
jobs:
  restore:
    if: github.repository == 'ios3kov/stellar-gradient' && github.ref == 'refs/heads/fix/stellar-release-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Restore exact previously tested source, validate, and commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 046d39fe05d611f547f61ed49fcbe202872fd2fd
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma, os
          parts = [Path('.ci/restore098/part%d.b64' % n).read_bytes() for n in range(4)]
          compressed = base64.b64decode(b''.join(parts), validate=True)
          decoder = lzma.LZMADecompressor(memlimit=64*1024*1024)
          patch = decoder.decompress(compressed, max_length=1024*1024)
          assert decoder.eof and not decoder.unused_data
          assert len(patch) == 48604
          assert hashlib.sha256(patch).hexdigest() == '8ca57cce32dcbbc3238d85a17eb7f21a6bf7981f7419e08cd65f50b5405ad417'
          Path(os.environ['RUNNER_TEMP'], 'restore098.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/restore098.patch"
          git apply "$RUNNER_TEMP/restore098.patch"
          SRC=stellar_gradient_v0.8.6_sdkless_mac
          python3 "$SRC/tools/embed_metal.py"
          git add -- README.md diagnostics "$SRC"
          test "$(git diff --cached --name-only | wc -l)" -eq 14
          TREE=$(git write-tree)
          test "$(git ls-tree "$TREE" README.md | awk '{print $3}')" = 82f9186ebc04a042317c1c07f9c8eda0aedfb439
          test "$(git ls-tree "$TREE" diagnostics | awk '{print $3}')" = bc04fa885f79dacf814881820d65c4feef4c14d3
          test "$(git ls-tree "$TREE" "$SRC" | awk '{print $3}')" = db7dbe10717262cb0935e410c1cfcda268a6d773
          (
            cd "$SRC"
            python3 tools/test_build_identity.py
            python3 tools/verify_grain_pipeline.py --self-test
            python3 tools/verify_metadata.py
            python3 tools/verify_code_freeze.py
            python3 tools/verify_metal_perf.py
            python3 tools/verify_ae_contract.py
            python3 tools/verify_sdkless_host.py
            python3 tools/verify_v08_host_freeze.py
            cmake -S . -B build-restore098 -DCMAKE_BUILD_TYPE=Release -DSTELLAR_WARNINGS_AS_ERRORS=ON
            cmake --build build-restore098 -j 3
            ctest --test-dir build-restore098 --output-on-failure
          )
          git diff --exit-code
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: restore reviewed v0.9.8 final-stage grain correction'
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/fix/stellar-release-gate
