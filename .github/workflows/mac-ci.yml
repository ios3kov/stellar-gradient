name: Mac CI

on:
  push:
    branches: [main, fix/stellar-release-gate]
    paths:
      - ".github/workflows/mac-ci.yml"
      - ".github/scripts/compile-metal.sh"
      - ".gitignore"
      - "stellar_gradient_v0.8.6_sdkless_mac/CMakeLists.txt"
      - "stellar_gradient_v0.8.6_sdkless_mac/FIRST_MAC_BUILD.command"
      - "stellar_gradient_v0.8.6_sdkless_mac/src/**"
      - "stellar_gradient_v0.8.6_sdkless_mac/sdkless/**"
      - "stellar_gradient_v0.8.6_sdkless_mac/tests/**"
      - "stellar_gradient_v0.8.6_sdkless_mac/tools/**"
      - "stellar_gradient_v0.8.6_sdkless_mac/docs/SOURCE_FREEZE_V08_SHA256.txt"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/mac-ci.yml"
      - ".github/scripts/compile-metal.sh"
      - ".gitignore"
      - "stellar_gradient_v0.8.6_sdkless_mac/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SRC: stellar_gradient_v0.8.6_sdkless_mac

jobs:
  source-record:
    name: Source identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Record exact clean source
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          mkdir -p evidence
          git rev-parse HEAD > evidence/COMMIT.txt
          git archive --format=tar HEAD | gzip -n > evidence/source.tar.gz
          (cd evidence && sha256sum source.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: StellarGradient-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error

  contracts:
    name: Static contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify frozen contracts
        working-directory: ${{ env.SRC }}
        run: |
          python3 tools/test_build_identity.py
          python3 tools/verify_grain_pipeline.py --self-test
          python3 tools/verify_metadata.py
          python3 tools/verify_code_freeze.py
          python3 tools/verify_metal_perf.py
          python3 tools/verify_ae_contract.py
          python3 tools/verify_sdkless_host.py
          python3 tools/verify_v08_host_freeze.py

  core-regression:
    name: Core ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [strict, asan-ubsan, tsan]
    steps:
      - uses: actions/checkout@v5
      - name: Configure + test
        working-directory: ${{ env.SRC }}
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.mode }}" in
            strict)
              cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release -DSTELLAR_WARNINGS_AS_ERRORS=ON
              cmake --build build-ci -j 3
              ctest --test-dir build-ci --output-on-failure
              ;;
            asan-ubsan)
              cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSTELLAR_SANITIZE=ON
              cmake --build build-ci -j 3
              ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 ctest --test-dir build-ci --output-on-failure
              ;;
            tsan)
              cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSTELLAR_TSAN=ON
              cmake --build build-ci -j 3
              TSAN_OPTIONS=halt_on_error=1 ctest --test-dir build-ci --output-on-failure
              ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: StellarGradient-core-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.SRC }}/build-ci/Testing/Temporary/
          if-no-files-found: warn

  native-mac:
    name: Native bridge + Metal
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Strict bridge regression
        working-directory: ${{ env.SRC }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-native
          CXX=(xcrun clang++ -std=c++17 -O3 -Wall -Wextra -Wpedantic -Werror -fno-fast-math -ffp-contract=off)
          COMMON=(sdkless/bridge/StellarBridge.cpp src/core/RenderPlan.cpp src/cpu/ReferenceRenderer.cpp)
          for test in bridge_parity_test bridge_formats_test bridge_mfr_test; do
            "${CXX[@]}" "sdkless/bridge/${test}.cpp" "${COMMON[@]}" -pthread -o ".ci-native/${test}"
            ".ci-native/${test}" | tee ".ci-native/${test}.log"
          done
          "${CXX[@]}" -c sdkless/bridge/MetalBridge.mm -o .ci-native/MetalBridge.o
      - name: Compile actual runtime Metal shader (not GPU execution)
        shell: bash
        run: |
          set -euo pipefail
          /bin/bash .github/scripts/compile-metal.sh "$SRC/src/gpu/StellarGradientMetal.metal" "$SRC/.ci-native" 2>&1 | tee "$SRC/.ci-native/metal-compile.log"
      - name: ASan + UBSan bridge smoke
        working-directory: ${{ env.SRC }}
        shell: bash
        run: |
          set -euo pipefail
          xcrun clang++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer sdkless/bridge/bridge_parity_test.cpp sdkless/bridge/StellarBridge.cpp src/core/RenderPlan.cpp src/cpu/ReferenceRenderer.cpp -pthread -o .ci-native/bridge_asan
          ASAN_OPTIONS=detect_leaks=0:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 .ci-native/bridge_asan | tee .ci-native/bridge_asan.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: StellarGradient-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.SRC }}/.ci-native/*.log
          include-hidden-files: true
          if-no-files-found: error

  rust-quality:
    name: Rust host quality
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-quality-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/sdkless/Cargo.lock', env.SRC)) }}
      - name: fmt + check + test + clippy
        working-directory: ${{ env.SRC }}
        run: |
          set -euo pipefail
          rm -rf .sdkless-ci
          cp -R sdkless .sdkless-ci
          cd .sdkless-ci
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --release --locked
          cargo test --release --locked
          cargo clippy --release --locked -- -D warnings

  release-bundle:
    name: ARM64 plugin bundle
    needs: [source-record, contracts, core-regression, native-mac, rust-quality]
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/sdkless/Cargo.lock', env.SRC)) }}
      - name: Build ARM64 host
        working-directory: ${{ env.SRC }}/sdkless
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          SG_REQUIRE_CLEAN_BUILD: "1"
        run: |
          set -euo pipefail
          cargo build --release --locked --target aarch64-apple-darwin
      - name: Bundle + ad-hoc sign
        shell: bash
        run: |
          set -euo pipefail
          TRIPLE=aarch64-apple-darwin
          BIN="target/$TRIPLE/release/libstellar_gradient_host.dylib"
          RSRC="target/$TRIPLE/release/stellar_gradient_host.rsrc"
          PKG="target/$TRIPLE/release/stellar_gradient_host_PkgInfo"
          PLIST="target/$TRIPLE/release/stellar_gradient_host_Info.plist"
          for f in "$BIN" "$RSRC" "$PKG" "$PLIST"; do test -f "$f" || { echo "missing $f"; exit 3; }; done

          BUNDLE="dist/StellarGradient.plugin"
          mkdir -p "$BUNDLE/Contents/MacOS" "$BUNDLE/Contents/Resources"
          cp "$BIN" "$BUNDLE/Contents/MacOS/StellarGradient"
          cp "$RSRC" "$BUNDLE/Contents/Resources/StellarGradient.rsrc"
          cp "$PKG" "$BUNDLE/Contents/PkgInfo"
          cp "$PLIST" "$BUNDLE/Contents/Info.plist"

          /usr/libexec/PlistBuddy -c 'Set :CFBundleExecutable StellarGradient' "$BUNDLE/Contents/Info.plist" || /usr/libexec/PlistBuddy -c 'Add :CFBundleExecutable string StellarGradient' "$BUNDLE/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier com.stellarlabs.StellarGradient' "$BUNDLE/Contents/Info.plist" || /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string com.stellarlabs.StellarGradient' "$BUNDLE/Contents/Info.plist"

          IDENTITIES=(target/"$TRIPLE"/release/build/stellar_gradient_host-*/out/stellar-build.json)
          test "${#IDENTITIES[@]}" -eq 1 && test -f "${IDENTITIES[0]}"
          python3 "$SRC/tools/package_identity.py" "$BUNDLE" --stamp "${IDENTITIES[0]}" --commit "$GITHUB_SHA"
          codesign --force --deep --sign - "$BUNDLE"
          codesign --verify --deep --strict "$BUNDLE"
          file "$BUNDLE/Contents/MacOS/StellarGradient"
          nm -gU "$BUNDLE/Contents/MacOS/StellarGradient" | grep -E 'EffectMain|PluginDataEntryFunction2'
          plutil -lint "$BUNDLE/Contents/Info.plist"
          python3 "$SRC/tools/package_identity.py" "$BUNDLE" --manifest StellarGradient.manifest.json --commit "$GITHUB_SHA"
          ditto -c -k --sequesterRsrc --keepParent "$BUNDLE" StellarGradient.plugin.zip
          shasum -a 256 StellarGradient.plugin.zip > StellarGradient.plugin.zip.sha256
          git rev-parse HEAD > StellarGradient.commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: StellarGradient-mac-arm64
          path: |
            StellarGradient.plugin.zip
            StellarGradient.plugin.zip.sha256
            StellarGradient.commit.txt
            StellarGradient.manifest.json
          if-no-files-found: error
