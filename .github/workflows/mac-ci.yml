name: Mac CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mac-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: "--cfg threaded_rendering --cfg smart_render --cfg gpu_render --cfg catch_panics"
  SOURCE_SHA256: "8fdadcac9e1bf531de40d59b7b51e095f0c3bdcc9eb3f6396f9099a2cc163413"

jobs:
  rust-quality:
    name: Rust quality
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Restore minimal source
        run: |
          python3 - <<'PY'
          import base64, hashlib, pathlib, lzma, tarfile
          root=pathlib.Path('.')
          s=(root/'ci/minimal.partA.b64').read_text().strip()+(root/'ci/minimal.partB.b64').read_text().strip()
          data=base64.b64decode(s)
          got=hashlib.sha256(data).hexdigest()
          want="${SOURCE_SHA256}"
          assert got==want, (got,want)
          p=pathlib.Path('/tmp/stellar_ci_src.tar.xz'); p.write_bytes(data)
          pathlib.Path('work').mkdir(exist_ok=True)
          with tarfile.open(p,'r:xz') as t: t.extractall('work')
          print('source sha256',got)
          PY
      - name: fmt + check + test + clippy
        working-directory: work/sdkless
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --release
          cargo test --release
          cargo clippy --release -- -D warnings

  native:
    name: Native C++ / Metal
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Restore minimal source
        run: |
          python3 - <<'PY'
          import base64, hashlib, pathlib, tarfile
          s=pathlib.Path('ci/minimal.partA.b64').read_text().strip()+pathlib.Path('ci/minimal.partB.b64').read_text().strip()
          data=base64.b64decode(s)
          assert hashlib.sha256(data).hexdigest()=="${SOURCE_SHA256}"
          p=pathlib.Path('/tmp/stellar_ci_src.tar.xz'); p.write_bytes(data)
          pathlib.Path('work').mkdir(exist_ok=True)
          with tarfile.open(p,'r:xz') as t: t.extractall('work')
          PY
      - name: Strict native compile
        working-directory: work
        run: |
          mkdir -p obj
          CXX="xcrun clang++ -std=c++17 -O3 -Wall -Wextra -Wpedantic -Werror -fno-fast-math -ffp-contract=off"
          $CXX -c src/core/RenderPlan.cpp -o obj/RenderPlan.o
          $CXX -c src/cpu/ReferenceRenderer.cpp -o obj/ReferenceRenderer.o
          $CXX -c sdkless/bridge/StellarBridge.cpp -o obj/StellarBridge.o
          $CXX -c sdkless/bridge/MetalBridge.mm -o obj/MetalBridge.o
          cat > /tmp/abi.cpp <<'CPP'
          #include "sdkless/bridge/StellarBridge.h"
          int main(){ return sizeof(SGParamsC)==180 && sizeof(SGRenderStateC)==264 ? 0 : 1; }
          CPP
          $CXX -I. /tmp/abi.cpp -o obj/abi
          ./obj/abi

  release-bundle:
    name: ARM64 plugin bundle
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt
      - name: Restore minimal source
        run: |
          python3 - <<'PY'
          import base64, hashlib, pathlib, tarfile
          s=pathlib.Path('ci/minimal.partA.b64').read_text().strip()+pathlib.Path('ci/minimal.partB.b64').read_text().strip()
          data=base64.b64decode(s)
          assert hashlib.sha256(data).hexdigest()=="${SOURCE_SHA256}"
          p=pathlib.Path('/tmp/stellar_ci_src.tar.xz'); p.write_bytes(data)
          pathlib.Path('work').mkdir(exist_ok=True)
          with tarfile.open(p,'r:xz') as t: t.extractall('work')
          PY
      - name: Build ARM64 host
        working-directory: work/sdkless
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          cargo fmt --all
          cargo build --release --target aarch64-apple-darwin
      - name: Bundle and sign
        run: |
          TRIPLE=aarch64-apple-darwin
          BIN="target/$TRIPLE/release/libstellar_gradient_host.dylib"
          RSRC="target/$TRIPLE/release/stellar_gradient_host.rsrc"
          PKG="target/$TRIPLE/release/stellar_gradient_host_PkgInfo"
          PLIST="target/$TRIPLE/release/stellar_gradient_host_Info.plist"
          for f in "$BIN" "$RSRC" "$PKG" "$PLIST"; do test -f "$f" || { echo "missing $f"; exit 3; }; done
          BUNDLE="dist/StellarGradient.plugin"
          mkdir -p "$BUNDLE/Contents/MacOS" "$BUNDLE/Contents/Resources"
          cp "$BIN" "$BUNDLE/Contents/MacOS/StellarGradient"
          cp "$RSRC" "$BUNDLE/Contents/Resources/StellarGradient.rsrc"
          cp "$PKG" "$BUNDLE/Contents/PkgInfo"
          cp "$PLIST" "$BUNDLE/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleExecutable StellarGradient' "$BUNDLE/Contents/Info.plist" || /usr/libexec/PlistBuddy -c 'Add :CFBundleExecutable string StellarGradient' "$BUNDLE/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier com.stellarlabs.StellarGradient' "$BUNDLE/Contents/Info.plist" || /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string com.stellarlabs.StellarGradient' "$BUNDLE/Contents/Info.plist"
          codesign --force --deep --sign - "$BUNDLE"
          codesign --verify --deep --strict "$BUNDLE"
          file "$BUNDLE/Contents/MacOS/StellarGradient"
          nm -gU "$BUNDLE/Contents/MacOS/StellarGradient" | grep -E 'EffectMain|PluginDataEntryFunction2'
          plutil -lint "$BUNDLE/Contents/Info.plist"
          ditto -c -k --sequesterRsrc --keepParent "$BUNDLE" StellarGradient.plugin.zip
      - uses: actions/upload-artifact@v4
        with:
          name: StellarGradient-mac-arm64
          path: StellarGradient.plugin.zip
          if-no-files-found: error
