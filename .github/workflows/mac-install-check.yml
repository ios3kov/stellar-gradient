name: Mac installation collector
on:
  push:
    branches: [fix/stellar-release-gate]
    paths:
      - diagnostics/Stellar_Mac_Check.command
      - diagnostics/test_mac_check.py
      - .github/workflows/mac-install-check.yml
  pull_request:
    branches: [main]
    paths:
      - diagnostics/Stellar_Mac_Check.command
      - diagnostics/test_mac_check.py
      - .github/workflows/mac-install-check.yml
permissions:
  contents: read
concurrency:
  group: mac-install-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  collector:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Syntax and isolated fixtures (no AE installation)
        shell: bash
        run: |
          set -euo pipefail
          /bin/bash -n diagnostics/Stellar_Mac_Check.command
          python3 diagnostics/test_mac_check.py
      - name: Record diagnostic file identity
        run: shasum -a 256 diagnostics/Stellar_Mac_Check.command
